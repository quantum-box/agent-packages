  short_description: "Verify, send, and collect replies for Tachyon Slack notifications."
  default_prompt: "Use $tachyon-slack-notify to switch tenants, send a Slack notification (optionally with a thread_key), collect thread replies via /v1/chat/replies, and report the API response and any permission or destination configuration blockers."
